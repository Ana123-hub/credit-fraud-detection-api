[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-fraud-detection"
version = "1.0.0"
description = "Real-time credit card fraud detection ML pipeline and FastAPI service"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["machine-learning", "fraud-detection", "fastapi", "scikit-learn"]

dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "pydantic==2.13.4",
    "pandas==3.0.3",
    "numpy==2.5.1",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
    "pyyaml==6.0.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "flake8>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]